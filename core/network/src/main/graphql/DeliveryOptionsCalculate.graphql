mutation DeliveryOptionsCalculate($id: ID!) {
  deliveryOptionsCalculate(id: $id) {
    deliveries {
      id
      shippingMethod {
        id
        name
        active
        price {
          amount
          currency
        }
        minimumDeliveryDays
        maximumDeliveryDays
      }
    }
    errors {
      field
      message
      code
    }
  }
}
