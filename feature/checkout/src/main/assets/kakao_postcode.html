<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }
        #wrap {
            width: 100%;
            height: 100%;
            min-height: 100%;
        }
    </style>
</head>
<body>
<div id="wrap"></div>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    function showError() {
        document.body.innerHTML = "<p style='padding:16px;font-family:sans-serif'>주소 찾기를 불러오지 못했습니다.</p>";
    }

    function embedPostcode() {
        var PostcodeCtor = (window.kakao && kakao.Postcode) || (window.daum && daum.Postcode);
        if (!PostcodeCtor) {
            showError();
            return;
        }
        var elementWrap = document.getElementById("wrap");
        if (!elementWrap || elementWrap.clientHeight < 80) {
            setTimeout(embedPostcode, 50);
            return;
        }
        new PostcodeCtor({
            oncomplete: function (data) {
                if (!window.KakaoPostcodeBridge) return;
                KakaoPostcodeBridge.onComplete(
                    data.zonecode || "",
                    data.address || "",
                    data.roadAddress || "",
                    data.jibunAddress || "",
                    data.userSelectedType || "",
                    data.sido || "",
                    data.sigungu || "",
                    data.bname || ""
                );
            },
            width: "100%",
            height: "100%"
        }).embed(elementWrap);
    }

    if (document.readyState === "complete") {
        embedPostcode();
    } else {
        window.addEventListener("load", embedPostcode);
    }
</script>
</body>
</html>
